<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dionathan</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        // Расширение стандартной конфигурации Tailwind под наши нужды
        tailwind.config = {
            theme: {
                extend: {
                    // Устанавливаем Chakra Petch как основной шрифт по умолчанию (классы sans)
                    fontFamily: {
                        sans: ['"Chakra Petch"', 'sans-serif'],
                    },
                    // Добавляем фирменные цвета (темный фон, цвет карточек, красный акцент и свечение)
                    colors: {
                        brand: {
                            dark: '#0a0a0c',
                            card: '#121216',
                            accent: '#e50914',
                            glow: '#ff003c'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Обычный CSS для глобальных стилей, которые сложнее сделать через Tailwind */
        body {
            font-family: 'Chakra Petch', sans-serif;
            background-color: #0a0a0c;
            color: #f5f5f7;
            overflow-x: hidden; /* Запрещаем горизонтальную прокрутку, чтобы сайт не дёргался */
        }

        /* Создаем эффект неонового свечения для текста с помощью теней */
        .neon-text {
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.6), 0 0 20px rgba(229, 9, 20, 0.3);
        }

        /* Кастомизация полосы прокрутки (скроллбара) для браузеров Chrome, Edge и Safari */
        ::-webkit-scrollbar {
            width: 8px;  /* Ширина вертикального скроллбара */
            height: 8px; /* Высота горизонтального скроллбара */
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0c; /* Цвет дорожки, по которой двигается ползунок */
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a; /* Цвет самого ползунка */
            border-radius: 4px;   /* Скругление ползунка */
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e50914; /* Цвет ползунка при наведении (фирменный красный) */
        }

        /* Плавный переход для прозрачности видео, чтобы при смене роликов не было резкого скачка */
        .video-container iframe {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <header class="sticky top-0 z-50 bg-brand-dark/90 backdrop-blur-md border-b border-zinc-800/80 px-6 py-4 md:px-12 flex items-center justify-between">
        
        <div class="flex items-center gap-8">
            <a href="#" class="text-3xl font-extrabold tracking-wider text-brand-accent neon-text hover:scale-105 transition-transform duration-200">
                kalleFLIX
            </a>
